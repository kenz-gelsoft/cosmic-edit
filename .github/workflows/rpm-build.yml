name: Build RPM (AlmaLinux 9)

on:
  push:
    branches: [ "rpm" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: almalinux:9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install System Dependencies
        run: |
          dnf install -y epel-release
          dnf install -y \
            rpm-build \
            pkgconfig \
            gcc-c++ \
            git \
            cargo \
            rust \
            glib2-devel \
            libxkbcommon-devel

      - name: Install Just
        run: |
          # Debianの'just'を補うため、cargoでインストール
          cargo install just
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Prepare Sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          # debian/rulesのclean時の挙動に合わせ、事前にvendor化
          just vendor
          # フォルダ名をversionに合わせて固める
          tar -czf ~/rpmbuild/SOURCES/cosmic-edit-0.1.0.tar.gz .

      - name: Execute rpmbuild
        run: |
          rpmbuild -ba cosmic-edit.spec --define "_topdir $HOME/rpmbuild"

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-edit-el9-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

