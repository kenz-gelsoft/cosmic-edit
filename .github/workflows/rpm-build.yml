name: Build RPM (AlmaLinux 9)

on:
  push:
    branches: [ "rpm" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
      options: --user root  # 確実にパッケージ追加ができるように

    steps:
      # checkout の前に最小限の git をインストールする
      - name: Install Git for checkout
        run: dnf install -y git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install System Dependencies
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb || /usr/bin/crb enable
          dnf install -y \
            rpm-build pkgconfig gcc-c++ cargo rust git cmake \
            glib2-devel libxkbcommon-devel freetype-devel \
            fontconfig-devel wayland-devel libinput-devel libxkbcommon-x11-devel

      - name: Install Just via Cargo
        run: |
          # ビルド済みのバイナリをインストール (高速化のため)
          cargo install just
          # CargoのバイナリパスをGitHubの環境変数に追加
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Prepare Sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          # PATHが通っているのでそのまま just が使えます
          just vendor
          tar -czf ~/rpmbuild/SOURCES/cosmic-edit-0.1.0.tar.gz .

      - name: Execute rpmbuild
        run: |
          # --nodeps を付与して 'just' のパッケージチェックを回避
          rpmbuild -ba --nodeps cosmic-edit.spec --define "_topdir $HOME/rpmbuild"

      - name: Prepare Sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          # cosmic-edit は submodules も含めて固める必要があります
          just vendor
          # フォルダ全体を固める
          tar -czf ~/rpmbuild/SOURCES/cosmic-edit-0.1.0.tar.gz .

      - name: Execute rpmbuild
        run: |
          rpmbuild -ba cosmic-edit.spec --define "_topdir $HOME/rpmbuild"

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-edit-el9-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

