name: Build RPM (AlmaLinux 9)

on:
  push:
    branches: [ "rpm" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
      options: --user root  # 確実にパッケージ追加ができるように

    steps:
      # checkout の前に最小限の git をインストールする
      - name: Install Git for checkout
        run: dnf install -y git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true


      - name: Install System Dependencies
        run: |
          # 1. EPELのインストール
          dnf install -y epel-release
          
          # 2. CRB (CodeReady Builder) リポジトリの有効化
          # これを入れないと libinput-devel や wayland-devel が見つかりません
          dnf config-manager --set-enabled crb || /usr/bin/crb enable
          
          # 3. 依存パッケージのインストール
          dnf install -y \
            rpm-build \
            pkgconfig \
            gcc-c++ \
            cargo \
            rust \
            glib2-devel \
            libxkbcommon-devel \
            cmake \
            freetype-devel \
            fontconfig-devel \
            wayland-devel \
            libinput-devel \
            libxkbcommon-x11-devel

      - name: Install Just
        run: |
          # 2026年現在、EPELにある場合は dnf で、なければ cargo で
          dnf install -y just || cargo install just
          if [ -f $HOME/.cargo/bin/just ]; then
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Prepare Sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          # cosmic-edit は submodules も含めて固める必要があります
          just vendor
          # フォルダ全体を固める
          tar -czf ~/rpmbuild/SOURCES/cosmic-edit-0.1.0.tar.gz .

      - name: Execute rpmbuild
        run: |
          rpmbuild -ba cosmic-edit.spec --define "_topdir $HOME/rpmbuild"

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-edit-el9-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

