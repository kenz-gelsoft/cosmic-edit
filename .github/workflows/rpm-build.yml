name: Build RPM (AlmaLinux 10)

on:
  push:
    branches: [ "rpm" ]
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
      options: --user root

    steps:
      - name: Install Git
        run: dnf install -y git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install System Dependencies
        run: |
          # EPEL 10 の導入
          dnf install -y epel-release
          # EL10では CRB の有効化方法が標準化されています
          dnf config-manager --set-enabled crb || dnf install -y 'dnf-command(config-manager)' && dnf config-manager --set-enabled crb
          # just を含む全依存関係を RPM でインストール
          dnf install -y \
            rpm-build \
            pkgconfig \
            gcc-c++ \
            cargo \
            rust \
            just \
            glib2-devel \
            libxkbcommon-devel \
            cmake \
            freetype-devel \
            fontconfig-devel \
            wayland-devel \
            libinput-devel \
            libxkbcommon-x11-devel

      - name: Prepare Sources
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          # current directory を cosmic-edit-0.1.0 という名前で固める
          mkdir -p ../cosmic-edit-0.1.0
          cp -r . ../cosmic-edit-0.1.0/
          cd ..
          tar -czf ~/rpmbuild/SOURCES/cosmic-edit-0.1.0.tar.gz cosmic-edit-0.1.0/


      - name: Execute rpmbuild
        run: |
          # BuildRequires に just を含めた spec ファイルでも問題なく通ります
          rpmbuild -ba cosmic-edit.spec --define "_topdir $HOME/rpmbuild"

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-edit-el10-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

