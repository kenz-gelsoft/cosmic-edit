app-id: io.github.kenz_gelsoft.CosmicEditIme
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-edit-ime
finish-args:
  - --device=dri
  - --filesystem=host
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: cosmic-edit-ime
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        # CARGO_HOME: /run/build/cosmic-edit/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - install -Dm0644 cargo/config .cargo/config.toml
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release # --all-features
      - install -Dm0755 target/release/cosmic-edit ${FLATPAK_DEST}/bin/cosmic-edit-ime
      - install -Dm0644 res/icons/hicolor/256x256/apps/com.system76.CosmicEdit.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm0644 res/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm0644 res/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/kenz-gelsoft/cosmic-edit.git
        branch: flatpak
        commit: b7effe4980a4932aef0a2435738d045b67b29d46
      # - cargo-sources.json
      - generated-sources.json
